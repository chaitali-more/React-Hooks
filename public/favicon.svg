<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Ring Gradients -->
    <linearGradient id="ring1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="ring2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="nucleus" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded Container -->
  <rect width="100" height="100" rx="22" fill="url(#bg-grad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2.5" />

  <!-- Glowing React Atom -->
  <g transform="translate(50, 50)" filter="url(#glow)">
    <!-- Orbit 1 -->
    <ellipse rx="38" ry="14" fill="none" stroke="url(#ring1)" stroke-width="4" transform="rotate(0)" />
    <!-- Orbit 2 -->
    <ellipse rx="38" ry="14" fill="none" stroke="url(#ring2)" stroke-width="4" transform="rotate(60)" />
    <!-- Orbit 3 -->
    <ellipse rx="38" ry="14" fill="none" stroke="url(#ring1)" stroke-width="4" transform="rotate(120)" />

    <!-- Center Nucleus Core -->
    <circle cx="0" cy="0" r="12" fill="#38bdf8" opacity="0.25" />
    <circle cx="0" cy="0" r="7.5" fill="url(#nucleus)" />
  </g>
</svg>